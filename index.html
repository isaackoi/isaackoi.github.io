<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>No public site</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      align-items: center;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
    }
    main {
      max-width: 28rem;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      margin: 0 0 0.65rem;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      margin: 0;
    }
    @media (prefers-color-scheme: dark) {
      p {
        color: #aaa;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>No public site</h1>
    <p>There is no public website at this address.</p>
  </main>
</body>
</html>
